    - generic [ref=f12e72]:
      - heading "Guest Lecture at I2IT" [level=2] [ref=f12e73]
      - generic [ref=f12e76]:
        - img "Honored to be invited as a Guest Speaker at I²IT, Pune by the Department of Computer Engineering." [ref=f12e80]
        - paragraph [ref=f12e82]:
          - generic [ref=f12e83]:
            - text: "Honored to be invited as a Guest Speaker at I²IT, Pune by the Department of Computer Engineering. I conducted a 2-hour interactive session for final-year engineering students on the topic:"
            - strong [ref=f12e84]: "“STQA in Industry: Tools, Trends & Careers”"
            - text: "We explored key areas including:"
            - strong [ref=f12e85]: 🔹 Evolution of QA – From manual to automation & why it matters in 2025 🔹 Automation Testing Tools – Selenium, Cypress, Playwright & CI/CD 🔹 AI & Machine Learning in Testing – Self-healing scripts & test case generation 🔹 QA in Agile & DevOps – Shift-left testing & continuous testing 🔹 Security & Performance Testing – JMeter, Burp Suite, OWASP basics 🔹 Career Path in QA – Essential skills, certifications, and growth roadmap
            - text: The session ended with an engaging Q&A, where students asked insightful questions about real-world testing challenges and career opportunities. I truly appreciate the curiosity and enthusiasm of the students, and I look forward to contributing more towards bridging the gap between academia and industry practices. 🚀 A big thank you to the faculty team at I²IT, Pune for this opportunity. 🙏
